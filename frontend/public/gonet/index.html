<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla de turnos GoNet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap">
<style>
/* Diseño fijo 1080x1920 (tótem 42" vertical). CSS básico para Chrome antiguo; el script lo escala al tamaño del marco. */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04100b; }
body { font-family: "Montserrat", "Arial Black", Arial, sans-serif; color: #ffffff; }
#wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: #04100b; }
#screen {
  position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden;
  -webkit-transform-origin: 0 0; transform-origin: 0 0;
  background: #06140e;
  background-image: -webkit-radial-gradient(85% 0%, ellipse, rgba(19,197,90,.45) 0%, rgba(19,197,90,0) 45%), -webkit-linear-gradient(top, #0b2a1d 0%, #06140e 60%);
  background-image: radial-gradient(ellipse at 85% 0%, rgba(19,197,90,.45) 0%, rgba(19,197,90,0) 45%), linear-gradient(to bottom, #0b2a1d 0%, #06140e 60%);
}
.abs { position: absolute; left: 60px; width: 960px; }
.lbl { font-size: 26px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: #9fc9b2; }

#head { top: 50px; height: 150px; }
#logo { position: absolute; left: 0; top: 0; width: 150px; height: 150px; border-radius: 75px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#headr { position: absolute; right: 0; top: 18px; text-align: right; }
#clock { font-size: 72px; font-weight: 900; margin-top: 6px; }

#now { top: 240px; height: 560px; border-radius: 44px; text-align: center;
  background: #0f9c48;
  background-image: -webkit-linear-gradient(-30deg, #18c75c 0%, #0a7a3c 100%);
  background-image: linear-gradient(150deg, #18c75c 0%, #0a7a3c 100%);
  box-shadow: 0 20px 50px rgba(0,0,0,.5); }
#now .lbl { color: #ffffff; padding-top: 44px; font-size: 32px; letter-spacing: 8px; }
#nownum { font-size: 270px; font-weight: 900; line-height: 300px; height: 300px; white-space: nowrap; letter-spacing: -4px; }
#nowwin { display: inline-block; margin-top: 14px; padding: 18px 56px; border-radius: 60px; background: #f6fbf7; color: #0a2a1a; font-size: 52px; font-weight: 900; text-transform: uppercase; }
#now.flash { -webkit-animation: flash 1s ease-in-out 2; animation: flash 1s ease-in-out 2; }
@-webkit-keyframes flash { 50% { box-shadow: 0 0 0 18px rgba(139,224,42,.75), 0 20px 50px rgba(0,0,0,.5); } }
@keyframes flash { 50% { box-shadow: 0 0 0 18px rgba(139,224,42,.75), 0 20px 50px rgba(0,0,0,.5); } }

#wins { top: 840px; height: 170px; }
.wbox { position: absolute; top: 0; width: 300px; height: 166px; border-radius: 28px; text-align: center; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.18); }
.wbox.hot { border: 3px solid #8be02a; box-shadow: 0 0 0 5px rgba(139,224,42,.25); }
.wbox .lbl { padding-top: 22px; font-size: 22px; letter-spacing: 3px; }
.wbox .v { font-size: 80px; font-weight: 900; line-height: 100px; white-space: nowrap; }
.wbox .v.free { font-size: 40px; color: #9fc9b2; }

#estT { top: 1050px; }
#est { top: 1095px; height: 220px; }
.ebox { position: absolute; width: 468px; height: 96px; border-radius: 24px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.14); }
.ebox .n { position: absolute; left: 28px; top: 28px; font-size: 36px; font-weight: 800; }
.ebox .t { position: absolute; right: 28px; top: 18px; font-size: 52px; font-weight: 900; color: #8be02a; }

#recT { top: 1340px; }
#rec { top: 1385px; height: 230px; }
.row { position: absolute; left: 0; width: 960px; height: 100px; border-radius: 24px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); }
.row .n { position: absolute; left: 36px; top: 10px; font-size: 68px; font-weight: 900; line-height: 80px; }
.row .w { position: absolute; right: 36px; top: 30px; font-size: 34px; font-weight: 900; color: #8be02a; text-transform: uppercase; }

#nextT { top: 1640px; }
#next { top: 1685px; height: 70px; overflow: hidden; white-space: nowrap; }
.chip { display: inline-block; margin-right: 14px; padding: 6px 22px; border-radius: 40px; background: rgba(255,255,255,.09); border: 2px solid rgba(255,255,255,.18); font-size: 44px; font-weight: 900; line-height: 52px; }

#promo { top: 1780px; height: 100px; border-radius: 26px; background: rgba(255,255,255,.09); border: 2px solid rgba(255,255,255,.22); }
#promo .l { position: absolute; left: 32px; top: 16px; }
#promo .l small { display: block; font-size: 20px; font-weight: 800; font-style: italic; color: #8be02a; text-transform: uppercase; }
#promo .l b { display: block; font-size: 38px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
#promo .r { position: absolute; right: 32px; top: 8px; text-align: right; }
#promo .r b { display: block; font-size: 62px; font-weight: 900; line-height: 66px; }
#promo .r small { display: block; font-size: 17px; color: #9fc9b2; }
</style>
</head>

    <div class="l"><small>¡Evolucionamos! Conoce los nuevos planes</small><b>GoConnect 1200 Mbps</b></div>
    <div class="r"><b>$29,90</b><small>+ imp. · promo x 6 facturas</small></div>
  </div>
</div></div>

<script>
(function () {
  var SERV = [
    { k: 'S', nm: 'Soporte', avg: 12 },
    { k: 'P', nm: 'Pagos', avg: 6 },
    { k: 'C', nm: 'Planes', avg: 15 },
    { k: 'E', nm: 'Equipos', avg: 9 }
  ];
  var WINS = [
    { id: 1, sv: 'S', cur: null, until: 0, idle: 0 },
    { id: 2, sv: 'PE', cur: null, until: 0, idle: 0 },
    { id: 3, sv: 'CE', cur: null, until: 0, idle: 0 }
  ];
  var counters = { S: 14, P: 22, C: 6, E: 9 };
  var q = [];
  var hist = [{ k: 'C', n: 4, w: 3 }, { k: 'P', n: 20, w: 2 }, { k: 'S', n: 12, w: 1 }, { k: 'E', n: 8, w: 3 }];

  function el(id) { return document.getElementById(id); }
  function pad(n) { n = String(n); while (n.length < 3) n = '0' + n; return n; }
  function code(t) { return t.k + '-' + pad(t.n); }
  function now() { return new Date().getTime(); }
  function rnd(a, b) { return (a + Math.random() * (b - a)) * 1000; }
  function pick() { var r = Math.random(); return r < 0.38 ? 'S' : r < 0.68 ? 'P' : r < 0.86 ? 'C' : 'E'; }
  function add(k) { counters[k]++; q.push({ k: k, n: counters[k], st: 'wait' }); }
  function waiting(k) { var o = [], i; for (i = 0; i < q.length; i++) if (q[i].st === 'wait' && (!k || q[i].k === k)) o.push(q[i]); return o; }
  function est(s) { return Math.max(3, Math.round((waiting(s.k).length + 1) * s.avg / 2)); }

  var i;
  for (i = 0; i < 7; i++) add(pick());
  WINS[0].cur = { k: 'S', n: 12 }; WINS[1].cur = { k: 'P', n: 20 }; WINS[2].cur = { k: 'C', n: 4 };
  for (i = 0; i < 3; i++) WINS[i].until = now() + (4 + i * 5) * 1000;
  var lastCalled = WINS[2].cur, lastWin = 3;

  function render(flash) {
    var h = '', j, w, nb = el('now');
    el('nowtxt').innerHTML = code(lastCalled);
    el('nowwin').innerHTML = 'Ventanilla ' + lastWin;
    var nn = el('nownum'), tx = el('nowtxt'); nn.style.fontSize = '';
    var fs = 270; while (tx.offsetWidth > 900 && fs > 120) { fs -= 10; nn.style.fontSize = fs + 'px'; }
    nb.className = 'abs';
    if (flash) { void nb.offsetWidth; nb.className = 'abs flash'; }

    for (j = 0; j < WINS.length; j++) {
      w = WINS[j];
      h += '<div class="wbox' + (w.id === lastWin ? ' hot' : '') + '" style="left:' + (j * 330) + 'px"><div class="lbl">Ventanilla ' + w.id + '</div>' +
        (w.cur ? '<div class="v">' + code(w.cur) + '</div>' : '<div class="v free">Libre</div>') + '</div>';
    }
    el('wins').innerHTML = h;

    h = '';
    for (j = 0; j < SERV.length; j++) {
      h += '<div class="ebox" style="left:' + ((j % 2) * 492) + 'px;top:' + (Math.floor(j / 2) * 116) + 'px"><span class="n">' + SERV[j].nm + '</span><span class="t">&asymp; ' + est(SERV[j]) + ' min</span></div>';
    }
    el('est').innerHTML = h;

    h = '';
    for (j = 1; j < 3 && j < hist.length; j++) {
      h += '<div class="row" style="top:' + ((j - 1) * 118) + 'px"><span class="n">' + code(hist[j]) + '</span><span class="w">Ventanilla ' + hist[j].w + '</span></div>';
    }
    el('rec').innerHTML = h;

    var nx = waiting(); h = '';
    for (j = 0; j < nx.length && j < 5; j++) h += '<span class="chip">' + code(nx[j]) + '</span>';
    el('next').innerHTML = h || '<span class="lbl">No hay personas esperando</span>';
  }

  var nextArrival = now() + 2500;
  function step() {
    var n = now(), flash = false, changed = false, j, k, w, mine;
    if (n >= nextArrival && waiting().length < 12) { add(pick()); nextArrival = n + rnd(3, 7); changed = true; }
    for (j = 0; j < WINS.length; j++) {
      w = WINS[j];
      if (w.cur && n >= w.until) { w.cur = null; changed = true; }
      if (!w.cur && n >= w.idle) {
        mine = null;
        for (k = 0; k < q.length; k++) if (q[k].st === 'wait' && w.sv.indexOf(q[k].k) > -1) { mine = q[k]; break; }
        if (mine) {
          mine.st = 'call'; w.cur = mine; w.until = n + rnd(9, 18);
          lastCalled = mine; lastWin = w.id;
          hist.unshift({ k: mine.k, n: mine.n, w: w.id }); if (hist.length > 6) hist.pop();
          flash = true; changed = true;
        } else { w.idle = n + 1500; }
      }
    }
    if (q.length > 60) { var keep = []; for (k = 0; k < q.length; k++) if (q[k].st === 'wait') keep.push(q[k]); q = keep; }
    if (changed) render(flash);
  }

  function fit() {
    var W = window.innerWidth || document.documentElement.clientWidth;
    var H = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(W / 1080, H / 1920);
    var sc = el('screen');
    var t = 'translate(' + Math.round((W - 1080 * s) / 2) + 'px,' + Math.round((H - 1920 * s) / 2) + 'px) scale(' + s + ')';
    sc.style.webkitTransform = t; sc.style.transform = t;
  }

  function clock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    el('clock').innerHTML = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  fit(); clock(); render(false);
  window.addEventListener('resize', fit);
  setInterval(clock, 10000);
  setInterval(step, 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(false); });
})();
</script>
</body>
</html>
